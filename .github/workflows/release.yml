name: Build and Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: ff360_Synthwave_FX_Suite_v1.0.0-beta_Windows_x64.zip
          - os: macos-14
            artifact_name: ff360_Synthwave_FX_Suite_v1.0.0-beta_macOS_Universal.zip

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    # --- Windows Build & Package ---
    - name: Configure CMake (Windows)
      if: runner.os == 'Windows'
      run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release

    - name: Build (Windows)
      if: runner.os == 'Windows'
      run: cmake --build build --config Release --parallel

    - name: Package (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path dist_win/Plugins | Out-Null
        Get-ChildItem -Path build -Recurse -Filter "*.vst3" | Copy-Item -Destination dist_win/Plugins -Recurse -Force
        Get-ChildItem -Path build -Recurse -Filter "*.exe" | Copy-Item -Destination dist_win/Plugins -Force
        if (Test-Path manuals) { Copy-Item -Path manuals -Destination dist_win/docs -Recurse -Force }
        Compress-Archive -Path dist_win/* -DestinationPath ${{ matrix.artifact_name }} -Force

    # --- macOS Universal Build & Package ---
    - name: Configure CMake (macOS)
      if: runner.os == 'macOS'
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

    - name: Build (macOS)
      if: runner.os == 'macOS'
      run: cmake --build build --config Release --parallel

    - name: Package (macOS)
      if: runner.os == 'macOS'
      run: |
        mkdir -p dist_mac/Plugins
        find build -type d -name "*.vst3" -exec cp -R {} dist_mac/Plugins/ \;
        find build -type d -name "*.component" -exec cp -R {} dist_mac/Plugins/ \;
        mkdir -p dist_mac/docs
        if [ -d "manuals" ]; then cp -R manuals/* dist_mac/docs/; fi
        cd dist_mac
        zip -r -y ../${{ matrix.artifact_name }} Plugins docs

    # --- Upload to Release ---
    - name: Upload Release Asset
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release upload v1.0.0-beta ${{ matrix.artifact_name }} --clobber
