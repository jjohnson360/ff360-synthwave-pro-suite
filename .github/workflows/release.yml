name: Build and Release

on:
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-12]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure CMake (Windows)
      if: matrix.os == 'windows-latest'
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release

    - name: Configure CMake (macOS)
      if: matrix.os == 'macos-12'
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

    - name: Build
      run: cmake --build build --config Release --parallel 4

    - name: Package macOS
      if: matrix.os == 'macos-12'
      run: |
        mkdir -p dist_mac/Plugins
        find build -type d -name "*.vst3" -exec cp -R {} dist_mac/Plugins/ \;
        find build -type d -name "*.component" -exec cp -R {} dist_mac/Plugins/ \;
        mkdir -p dist_mac/docs
        cp -R manuals dist_mac/docs/ || true
        cd dist_mac
        zip -r -y ../ff360_Synthwave_FX_Suite_v1.0.0-beta_macOS_Universal.zip Plugins/ docs/

    - name: Upload Release Asset (macOS)
      if: matrix.os == 'macos-12'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release upload v1.0.0-beta ff360_Synthwave_FX_Suite_v1.0.0-beta_macOS_Universal.zip --clobber
